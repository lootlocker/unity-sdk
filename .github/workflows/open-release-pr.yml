name: Open Release PR
run-name: "Open release candidate PR for ${{ inputs.bump }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Type of version bump
        required: true
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
        default: auto
      custom_version:
        description: Custom version override (e.g. 8.1.0). Leave empty to use semver bump.
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

# Serialize release runs so two dispatches cannot race on the dev branch.
concurrency:
  group: open-release-pr
  cancel-in-progress: false

jobs:
  open-pr:
    name: Create release candidate PR
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.LL_PERSONAL_ACCESS_TOKEN }}

      - name: Read current version
        id: current
        run: |
          VERSION=$(jq -r '.version' package.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Could not read version from package.json"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Current version: ${VERSION}"

      - name: Check for an existing release PR or pending bump
        id: existing-pr
        run: |
          PR_NUMBER=$(gh pr list \
            --base main \
            --head dev \
            --state open \
            --json number,labels \
            --jq '[.[] | select([.labels[].name | ascii_downcase] | index("release candidate"))][0].number // ""')
          echo "PR_NUMBER=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

          # A previous run may have pushed the bump to dev and then failed before
          # opening the PR. Reuse that version instead of bumping again.
          PENDING_VERSION=""
          if [ -z "$PR_NUMBER" ]; then
            PENDING_VERSION=$(git log -1 --format=%s origin/dev | sed -n 's/^Bump version to v\{0,1\}\([0-9][0-9.]*\)$/\1/p')
            if [ "$PENDING_VERSION" = "${{ steps.current.outputs.VERSION }}" ]; then
              PENDING_VERSION=""
            fi
            # A bump that already has a release tag was released, not left pending.
            if [ -n "$PENDING_VERSION" ] && git rev-parse -q --verify "refs/tags/v${PENDING_VERSION}" >/dev/null; then
              PENDING_VERSION=""
            fi
            if [ -n "$PENDING_VERSION" ]; then
              echo "PENDING_VERSION=${PENDING_VERSION}" >> "$GITHUB_OUTPUT"
              echo "::warning::dev already carries an unreleased bump to ${PENDING_VERSION} with no release PR. Reusing it instead of bumping again."
            fi
          fi

          if [ -n "$PR_NUMBER" ]; then
            echo "Release PR #${PR_NUMBER} is already open. It will be updated instead of opening a new one."
            echo "::notice::Release PR #${PR_NUMBER} already exists; the version bump inputs are ignored. Close that PR first to bump again."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Get previous release tag and commit log
        id: prev-tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "TAG=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "Previous tag: ${LATEST_TAG}"
          REV_RANGE=""
          if [ -n "$LATEST_TAG" ] && [ "$LATEST_TAG" != "v0.0.0" ]; then
            REV_RANGE="${LATEST_TAG}..HEAD"
          else
            REV_RANGE="HEAD"
          fi

          git log "$REV_RANGE" --format="%s" > /tmp/commits.log
          COMMIT_COUNT=$(wc -l < /tmp/commits.log)
          echo "Commits: ${COMMIT_COUNT}"
          echo "COMMIT_COUNT=${COMMIT_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Calculate new version
        id: new-version
        if: steps.existing-pr.outputs.PR_NUMBER == '' && steps.existing-pr.outputs.PENDING_VERSION == ''
        run: |
          CURRENT="${{ steps.current.outputs.VERSION }}"
          CUSTOM="${{ inputs.custom_version }}"
          BUMP="${{ inputs.bump }}"
          ALREADY_CALCULATED=false

          if [ -n "$CUSTOM" ]; then
            NEW="$CUSTOM"
            echo "Using custom version: ${NEW}"
            ALREADY_CALCULATED=true
          fi

          if [ "$BUMP" = "auto" ] && [ "$ALREADY_CALCULATED" = "false" ]; then
            echo "Auto-detecting version from OpenRouter..."
            if [ -z "${{ secrets.OPENROUTER_API_KEY }}" ]; then
              echo "::warning::OPENROUTER_API_KEY not set. Falling back to patch bump."
              BUMP="patch"
            else
              COMMITS=$(head -100 /tmp/commits.log)
              printf 'The current version is v%s. Based on these commit messages since the last release, determine the correct semver version for the next release. Analyze breaking changes, new features, and fixes. Respond with only the version number (e.g., 9.0.0).\n\n%s\n' "$CURRENT" "$COMMITS" > /tmp/version-prompt.txt
              RESPONSE=$(curl -s "https://openrouter.ai/api/v1/chat/completions" \
                -H "Authorization: Bearer ${{ secrets.OPENROUTER_API_KEY }}" \
                -H "Content-Type: application/json" \
                -d "$(jq -n --rawfile prompt /tmp/version-prompt.txt '{model:"deepseek/deepseek-v4-pro",messages:[{role:"user",content:$prompt}],reasoning:{effort:"low"},max_tokens:2000,temperature:0}')")
              NEW=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // ""' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
              if [ -z "$NEW" ]; then
                echo "::warning::AI returned no parseable version. Falling back to patch bump."
                BUMP="patch"
              else
                echo "AI suggested version: ${NEW}"
                ALREADY_CALCULATED=true
              fi
            fi
          fi

          if [ "$ALREADY_CALCULATED" = "false" ]; then
            BUMP="${{ inputs.bump }}"
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            NEW="${MAJOR}.${MINOR}.${PATCH}"
            echo "Bumped ${CURRENT} -> ${NEW} (${BUMP})"
          fi

          echo "TAG=v${NEW}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${NEW}" >> "$GITHUB_OUTPUT"

      - name: Resolve release version
        id: release-version
        run: |
          if [ -n "${{ steps.existing-pr.outputs.PR_NUMBER }}" ]; then
            VERSION="${{ steps.current.outputs.VERSION }}"
          elif [ -n "${{ steps.existing-pr.outputs.PENDING_VERSION }}" ]; then
            VERSION="${{ steps.existing-pr.outputs.PENDING_VERSION }}"
          else
            VERSION="${{ steps.new-version.outputs.VERSION }}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "TAG=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"

      - name: Commit version bump to dev
        if: steps.existing-pr.outputs.PR_NUMBER == '' && steps.existing-pr.outputs.PENDING_VERSION == ''
        run: |
          NEW_VERSION="${{ steps.release-version.outputs.VERSION }}"

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # dev may have moved since checkout, so re-apply the bump on top of the
          # latest dev and retry rather than failing on a non-fast-forward push.
          for attempt in 1 2 3 4 5; do
            git fetch origin dev
            git reset --hard origin/dev
            jq --arg v "$NEW_VERSION" '.version = $v' package.json > package.json.tmp
            mv package.json.tmp package.json
            git add package.json
            if git diff --cached --quiet; then
              echo "Version is already ${NEW_VERSION}; nothing to commit."
              exit 0
            fi
            git commit -m "Bump version to ${NEW_VERSION}"
            if git push origin HEAD:dev; then
              echo "Pushed version bump to dev."
              exit 0
            fi
            echo "::warning::Push to dev failed (attempt ${attempt}); retrying against the latest dev."
            sleep $((attempt * 5))
          done

          echo "::error::Could not push the version bump to dev after 5 attempts."
          exit 1

      - name: Generate release notes
        run: |
          PREV="${{ steps.prev-tag.outputs.TAG }}"
          NEW_TAG="${{ steps.release-version.outputs.TAG }}"
          NEW_VERSION="${{ steps.release-version.outputs.VERSION }}"
          COMMITS=$(cat /tmp/commits.log)

          echo "::group::Commits since ${PREV:-beginning}"
          echo "$COMMITS"
          echo "::endgroup::"

          if [ -n "${{ secrets.OPENROUTER_API_KEY }}" ]; then
            echo "Generating release notes via OpenRouter..."
            printf 'You are writing release notes for LootLocker Unity SDK version %s.\n\nBelow are the commit messages since the last release. Write concise, user-facing release notes following this template exactly. Only include sections that have content. Keep the audience in mind: game developers using LootLocker in Unity.\n\nTemplate:\n### Features\n- Feature Title - Description of what the developer can now do.\n\n### Fixes\n- Fixed an issue where X would happen when Y.\n\n### Breaking Changes\n- Removed / changed API - explain migration.\n\nFull Changelog: [%s...%s](https://github.com/lootlocker/unity-sdk/compare/%s...%s)\n\nCommit messages:\n%s\n' "$NEW_VERSION" "$PREV" "$NEW_TAG" "$PREV" "$NEW_TAG" "$COMMITS" > /tmp/ai-prompt.txt
            RESPONSE=$(curl -s "https://openrouter.ai/api/v1/chat/completions" \
              -H "Authorization: Bearer ${{ secrets.OPENROUTER_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --rawfile prompt /tmp/ai-prompt.txt '{model:"deepseek/deepseek-v4-pro",messages:[{role:"user",content:$prompt}],reasoning:{effort:"medium"},max_tokens:8000,temperature:0.3}')")
            NOTES=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // ""')
            if [ -n "$NOTES" ] && [ "$NOTES" != "null" ]; then
              echo "$NOTES" > /tmp/release-notes.md
              echo "AI-generated release notes."
            else
              echo "::warning::OpenRouter returned empty response, falling back to template."
              NOTES=""
            fi
          fi

          if [ ! -s /tmp/release-notes.md ]; then
            echo "Using static template."
            printf '### Features\n\n- Feature Title - Description.\n\n### Fixes\n\n- Fixed ...\n\nFull Changelog: [%s...%s](https://github.com/lootlocker/unity-sdk/compare/%s...%s)\n' "$PREV" "$NEW_TAG" "$PREV" "$NEW_TAG" > /tmp/release-notes.md
          fi

          echo "Release notes generated."

      - name: Create or update PR
        run: |
          NEW_VERSION="${{ steps.release-version.outputs.VERSION }}"
          TITLE="Release v${NEW_VERSION}"
          PR_NUMBER="${{ steps.existing-pr.outputs.PR_NUMBER }}"

          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" \
              --title "$TITLE" \
              --body-file /tmp/release-notes.md
          else
            gh pr create \
              --title "$TITLE" \
              --body-file /tmp/release-notes.md \
              --base main \
              --head dev \
              --label "release candidate" \
              --reviewer "kirre-bylund"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
